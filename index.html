<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>upVoulume - Free Online Audio & Video Volume Booster up to 1000%</title>
<meta name="description" content="upVoulume: boost MP3, WAV, MP4 volume up to 1000% in your browser. Change the gain live while it plays.">
<meta name="keywords" content="upVoulume, volume booster, audio booster, gain, web audio api, increase mp3 volume">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0d0d10">
<meta property="og:title" content="upVoulume - Volume Booster">
<meta property="og:description" content="Boost audio and video volume up to 1000%, live, in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mahir-g9.github.io/upVoulume/">
<style>
:root{
  --bg:#0d0d10; --panel:#16161b; --line:#26262e;
  --text:#f2f0eb; --dim:#8b8a93; --accent:#e8b04b;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:"Inter","Helvetica Neue",Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
main{width:100%;max-width:520px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:1.4rem;letter-spacing:.02em;margin-bottom:28px;color:var(--dim)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 28px}
.pick{
  display:block;position:relative;border:1px dashed var(--line);border-radius:12px;
  padding:14px 16px;color:var(--dim);font-size:.95rem;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .2s,color .2s;
}
.pick:hover,.pick:focus-within{border-color:var(--accent);color:var(--text)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
video,audio{display:block;width:100%;margin-top:20px;border-radius:12px;background:#000;outline:none}
audio{background:none}
.hidden{display:none}
.gain{margin-top:36px;text-align:center}
.readout{font-family:Georgia,"Times New Roman",serif;font-size:4.5rem;line-height:1;font-variant-numeric:tabular-nums;transition:color .2s}
.readout small{font-size:1.6rem;color:var(--dim);margin-left:4px}
.readout.hot{color:var(--accent)}
.label{color:var(--dim);font-size:.9rem;margin-top:8px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;
  margin-top:32px;outline:none;cursor:pointer;
  background:linear-gradient(to right,var(--accent) var(--fill,10%),var(--line) var(--fill,10%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:var(--text);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--line);
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:var(--text);border:4px solid var(--bg);
}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:8px}
.scale{display:flex;justify-content:space-between;color:var(--dim);font-size:.8rem;margin-top:12px}
.warn{margin-top:20px;text-align:center;font-size:.85rem;color:var(--accent);min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>upVoulume</h1>
  <div class="panel">
    <label class="pick">
      <span id="fileName">Choose an audio or video file</span>
      <input type="file" id="fileInput" accept="audio/*,video/*,.mp3,.wav,.ogg,.mp4,.webm,.m4a">
    </label>

    <video id="player" class="hidden" controls playsinline></video>

    <div class="gain">
      <div class="readout" id="readout">100<small>%</small></div>
      <div class="label">Gain</div>
      <input type="range" id="gain" min="0" max="1000" step="1" value="100" aria-label="Gain percentage">
      <div class="scale"><span>0%</span><span>100%</span><span>500%</span><span>1000%</span></div>
      <div class="warn" id="warn"></div>
    </div>
  </div>
</main>

<script>
(function () {
  var player = document.getElementById('player');
  var fileInput = document.getElementById('fileInput');
  var fileName = document.getElementById('fileName');
  var slider = document.getElementById('gain');
  var readout = document.getElementById('readout');
  var warn = document.getElementById('warn');

  var ctx = null, gainNode = null, url = null;

  function setupAudio() {
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    var src = ctx.createMediaElementSource(player);
    gainNode = ctx.createGain();
    // Soft limiter so very high gain stays loud without harsh digital clipping
    var limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -2;
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.1;
    src.connect(gainNode);
    gainNode.connect(limiter);
    limiter.connect(ctx.destination);
    applyGain();
  }

  function applyGain() {
    var pct = Number(slider.value);
    readout.firstChild.nodeValue = pct;
    readout.classList.toggle('hot', pct > 100);
    slider.style.setProperty('--fill', (pct / 10) + '%');
    warn.textContent = pct > 300 ? 'Very loud. Lower your device volume first.' : '';
    if (gainNode) {
      // Smooth change so moving the slider while playing never clicks
      gainNode.gain.setTargetAtTime(pct / 100, ctx.currentTime, 0.015);
    }
  }

  slider.addEventListener('input', applyGain);

  fileInput.addEventListener('change', function () {
    var f = fileInput.files[0];
    if (!f) return;
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(f);
    fileName.textContent = f.name;
    player.src = url;
    player.classList.remove('hidden');
    // Audio-only files: shrink the player to a plain control bar
    player.style.height = f.type.indexOf('audio') === 0 ? '54px' : '';
  });

  // Audio context must start from a user gesture
  player.addEventListener('play', function () {
    setupAudio();
    if (ctx.state === 'suspended') ctx.resume();
  });

  applyGain();
})();
</script>
</body>
</html>
